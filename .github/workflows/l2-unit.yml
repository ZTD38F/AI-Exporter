name: L2 Unit Tests

on:
  pull_request:
    paths:
      - 'src/l2/**'
      - 'tests/**'
      - 'scripts/test-l2.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/l2-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l2-unit:
    name: L2 Unit Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run L2-owned unit and transactional contract tests
        run: npm run test:l2:unit
