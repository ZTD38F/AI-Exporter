name: L4 Unit and Contract Tests

on:
  pull_request:
    branches: [dev/v2]
    paths:
      - 'src/l4/**'
      - 'tests/**'
      - '.github/workflows/l4-unit.yml'

permissions:
  contents: read

jobs:
  l4-tests:
    name: L4 isolated unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run L4 unit suite (independent of cross-module migration)
        run: node tests/run_l4.cjs
      - name: Type-check L4 module and contract tests
        run: npx tsc --noEmit -p tests/tsconfig.l4.json
