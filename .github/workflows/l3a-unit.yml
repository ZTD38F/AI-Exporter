name: L3a Storage Unit Tests

on:
  pull_request:
    branches: [dev/v2]
    paths:
      - '.github/workflows/l3a-unit.yml'
      - 'src/l3a/**'
      - 'tests/**'
      - 'scripts/test-unit.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-unit:
    name: L3a Frozen Contract Unit Suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Storage native browser tests
        run: npx playwright install --with-deps chromium
      - name: Permit sandboxed Playwright on Ubuntu
        run: bash scripts/setup-playwright-sandbox.sh
      - name: Run L3a Tier-1 suites independently of unrelated module type errors
        run: |
          node - <<'NODE'
          const {spawnSync} = require('node:child_process');
          const {suites} = require('./tests/l3a-tier1.json');
          const result = spawnSync(process.execPath, ['scripts/test-unit.cjs', ...suites], {stdio:'inherit'});
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE
