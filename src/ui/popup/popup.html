<!DOCTYPE html>
<html lang="zh-CN" data-theme="loading" data-theme-bootstrap data-theme-unready>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Exporter</title>
<style>
#status { white-space: pre-line; }
:root{--bg:#090a10;--card:#12131d;--border:#222436;--text:#f1f3fc;--muted:#8a92b2;--accent:#4f46e5;--accent2:#06b6d4}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.4;}
body{width:360px;margin:0;background:var(--bg);color:var(--text);padding:12px;position:relative;overflow-x:hidden;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.02em}
.row{display:flex;gap:6px}
button{flex:1;border:0;border-radius:9px;padding:9px 10px;font-weight:600;cursor:pointer;transition:all 0.15s ease}
button:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;pointer-events:none}
button.ghost:disabled{background:#11121c;color:#6b7280;border-color:#1e2030}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;box-shadow:0 2px 8px rgba(79,70,229,0.35)}
.primary:hover{opacity:.95;box-shadow:0 4px 12px rgba(6,182,212,0.35)}
.ghost{background:#171926;color:var(--text);border:1px solid var(--border)}
.tab-group{display:flex;background:#0b0c14;border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;margin-bottom:8px;}
.tab-btn{flex:1 0 auto;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:6px 2px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s ease;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,0.05);}
.tab-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#ffffff;box-shadow:0 1px 4px rgba(0,0,0,0.4);}
.tab-btn:disabled{opacity:0.35;cursor:not-allowed;pointer-events:none;}
select{width:100%;background:#0e0f17;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:11px}
select:disabled{opacity:0.45;cursor:not-allowed;background:#10111a;color:#6b7280}
.label.disabled{opacity:0.45}
.log{font-size:11px;color:var(--muted);white-space:pre-wrap;max-height:80px;overflow:auto;font-family:ui-monospace,monospace;margin-top:6px}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-track{background:transparent}
.log::-webkit-scrollbar-thumb{background:#282c44;border-radius:99px}
.badge{font-size:10px;background:#171929;border:1px solid var(--border);color:#a5b4fc;padding:2px 7px;border-radius:99px}
.badge.inactive{background:#141520;color:#6b7280;border-color:#202232}
.progress{height:5px;background:#161824;border-radius:99px;overflow:hidden;margin-top:6px;display:none}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
input[type=checkbox].toggle{
  -webkit-appearance:none;appearance:none;width:26px;height:14px;background:#1e2030;border-radius:14px;position:relative;cursor:pointer;outline:none;margin:0;flex:none;transition:background 0.2s;
}
input[type=checkbox].toggle::after{
  content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--muted);border-radius:50%;transition:transform 0.2s,background 0.2s;
}
input[type=checkbox].toggle:checked{background:linear-gradient(135deg,var(--accent),var(--accent2))}
input[type=checkbox].toggle:checked::after{transform:translateX(12px);background:white}
/* Reuse the tutorial's platform selector without a modal or a second toolbar. */
#popupMain[hidden],#popupPermission[hidden]{display:none}
#popupPermission{margin-bottom:0}
#popupPermission h2{margin:0 0 6px;font-size:15px;font-weight:700}
#popupPermission p.popup-permission-description{margin:0 0 8px;color:var(--muted);font-size:12px;line-height:1.5}
#popupPermission .platform-authorization{margin:8px 0 0;gap:9px}
#popupPermission .platform-permission-row{padding:8px 10px}
#popupPermission .platform-permission-list{border-color:var(--border)}
#popupPermission .platform-permission-list legend{color:var(--muted)}
#popupPermission .platform-permission-state,#popupPermission .platform-permission-hint,#popupPermission .platform-permission-row details{color:var(--muted)}
#popupPermission .platform-permission-state[data-authorized="true"]{color:var(--ok)}
</style>
<link rel="stylesheet" href="/src/ui/guidance/tourGuide.css">
<link rel="stylesheet" href="/src/ui/shared/theme.css">
<script src="/src/ui/shared/themeBootstrap.js"></script>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
  <div style="display:flex;align-items:center;gap:6px">
    <b style="font-size:13px;">Gemini Exporter</b>
  </div>
  <button id="btnThemeToggle" type="button" class="ghost theme-switch" aria-label="切换到浅色模式" title="切换到浅色模式">☀</button>
</div>

<section id="popupPermission" class="card" hidden aria-labelledby="popupPermissionTitle">
  <h2 id="popupPermissionTitle"></h2>
  <p id="popupPermissionDescription" class="popup-permission-description"></p>
  <div id="popupPermissionControls"></div>
</section>
<div id="popupMain" hidden>
<div id="chatInfoCard" class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
    <span id="currentChatLabel" class="label" style="margin:0;color:var(--current-chat-accent, #818cf8);" data-i18n="currentChatLabel">当前会话</span>
  </div>
  <div id="currentChatContent">
    <div id="currentChatTitle" style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:5px;" data-i18n="detectingChat">正在识别当前会话...</div>
  </div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span class="label" style="margin:0;" data-i18n="format">格式</span>
    <span id="activeFormatLabel" style="font-size:10px;color:var(--accent2);font-weight:600;">Markdown</span>
  </div>
  <div id="formatTabs" class="tab-group" role="tablist">
    <button type="button" class="tab-btn active" data-value="markdown" data-format="markdown" data-i18n="fmtMarkdownTab">Markdown</button>
    <button type="button" class="tab-btn" data-value="pdf" data-format="pdf" data-i18n="fmtPdfTab">PDF</button>
    <button type="button" class="tab-btn" data-value="docx" data-format="docx" data-i18n="fmtDocxTab">Word</button>
    <button type="button" class="tab-btn" data-value="html" data-format="html" data-i18n="fmtHtmlTab">HTML</button>
    <button type="button" class="tab-btn" data-value="json" data-format="json" data-i18n="fmtJsonStandardTab">JSON</button>
  </div>

  <div class="row" style="margin-bottom:0px;">
    <button id="btnCurrent" class="ghost" style="font-size:11px;padding:9px 6px;display:flex;align-items:center;justify-content:center;gap:4px;" data-i18n="btnCurrent">📥 导出当前页面</button>
    <button id="btnOptions" class="primary" style="font-size:11px;padding:9px 6px;display:flex;align-items:center;justify-content:center;gap:4px;" data-i18n="btnOptions">去控制台批量导出 ↗</button>
  </div>

  <p id="status" class="log" role="status" aria-live="polite" style="margin:6px 0 0;min-height:15px;"></p>
</div>
</div>

<script src="/lib/jszip.min.js"></script>
<script src="/dist/ui/popup.js"></script>
</body>
</html>
