<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Exporter</title>
<style>
:root{--bg:#090a10;--card:#12131d;--border:#222436;--text:#f1f3fc;--muted:#8a92b2;--accent:#4f46e5;--accent2:#06b6d4}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.4;}
body{width:360px;margin:0;background:var(--bg);color:var(--text);padding:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.02em}
.row{display:flex;gap:8px}
button{flex:1;border:0;border-radius:9px;padding:10px 12px;font-weight:600;cursor:pointer;transition:all 0.15s ease}
button:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;pointer-events:none}
button.ghost:disabled{background:#11121c;color:#6b7280;border-color:#1e2030}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;box-shadow:0 2px 8px rgba(79,70,229,0.35)}
.primary:hover{opacity:.95;box-shadow:0 4px 12px rgba(6,182,212,0.35)}
.ghost{background:#171926;color:var(--text);border:1px solid var(--border)}
.ghost:hover{background:#1f2233}
select{width:100%;background:#0e0f17;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;margin-bottom:8px}
select:disabled{opacity:0.45;cursor:not-allowed;background:#10111a;color:#6b7280}
.label.disabled{opacity:0.45}
.log{font-size:11px;color:var(--muted);white-space:pre-wrap;max-height:90px;overflow:auto;font-family:ui-monospace,monospace}
.log::-webkit-scrollbar{width:5px}
.log::-webkit-scrollbar-track{background:transparent}
.log::-webkit-scrollbar-thumb{background:#282c44;border-radius:99px}
.log::-webkit-scrollbar-thumb:hover{background:#4a5280}
.badge{font-size:10px;background:#171929;border:1px solid var(--border);color:#a5b4fc;padding:2px 7px;border-radius:99px}
.badge.inactive{background:#141520;color:#6b7280;border-color:#202232}
.progress{height:6px;background:#161824;border-radius:99px;overflow:hidden;margin-top:8px;display:none}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
input[type=checkbox].toggle{
  -webkit-appearance:none;appearance:none;width:26px;height:14px;background:#1e2030;border-radius:14px;position:relative;cursor:pointer;outline:none;margin:0;flex:none;transition:background 0.2s;
}
input[type=checkbox].toggle::after{
  content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--muted);border-radius:50%;transition:transform 0.2s,background 0.2s;
}
input[type=checkbox].toggle:checked{background:linear-gradient(135deg,var(--accent),var(--accent2))}
input[type=checkbox].toggle:checked::after{transform:translateX(12px);background:white}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
  <div style="display:flex;align-items:center;gap:6px">
    <b>Gemini Exporter</b>
    <span id="countBadge" class="badge">0</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div style="display:inline-flex;align-items:center;gap:4px;user-select:none;background:#141624;border:1px solid var(--border);padding:2px 6px;border-radius:14px;" title="Switch Language / 切换语言">
      <span id="labelLangZh" style="font-size:10px;font-weight:600;color:var(--text);transition:color .2s;cursor:pointer;">中</span>
      <input type="checkbox" id="langToggle" class="toggle">
      <span id="labelLangEn" style="font-size:10px;font-weight:600;color:var(--muted);transition:color .2s;cursor:pointer;">EN</span>
    </div>
  </div>
</div>

<div class="card">
  <div class="label" data-i18n="noteLabel">说明</div>
  <div style="font-size:11px; line-height:1.5; color:#b8bdd0" data-i18n="popupDesc">
    在 gemini.google.com 页面会自动同步会话列表。点击“去工作台选 批量导出”可进入导出面板进行批量管理和下载。
  </div>
</div>

<div class="card">
  <div class="label" data-i18n="quickExportLabel">快捷导出</div>
  <select id="format">
    <option value="markdown" selected data-i18n="fmtMarkdown">Markdown (.md)</option>
    <option value="json_openai" data-i18n="fmtJsonOpenAI">JSON (OpenAI格式)</option>
    <option value="json" data-i18n="fmtJsonStandard">JSON (插件标准)</option>
    <option value="json_raw" data-i18n="fmtJsonRaw">JSON (Gemini原始)</option>
  </select>
  <div class="row">
    <button id="btnCurrent" class="ghost" data-i18n="btnCurrent">只导当前页</button>
    <button id="btnOptions" class="primary" data-i18n="btnOptions">去工作台选 批量导出</button>
  </div>
   <div id="progWrap" class="progress"><div id="bar" class="bar"></div></div>
   <div id="log" class="log" style="display:none"></div>
</div>

<script src="/dist/ui/popup.js"></script>
</body>
</html>
