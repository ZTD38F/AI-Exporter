<!DOCTYPE html>
<html lang="zh-CN" data-theme="loading" data-theme-bootstrap data-theme-unready>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Exporter</title>
<link rel="stylesheet" href="/src/ui/guidance/tourGuide.css">
<style>
#status { white-space: pre-line; }
  :root{
    --bg:#090a10;
    --card:#12131d;
    --card-inner:#0e0f17;
    --border:#222436;
    --border-focus:#3b4066;
    --text:#f1f3fc;
    --muted:#8a92b2;
    --accent:#4f46e5;
    --accent2:#06b6d4;
    --ok:#10b981;
    --warn:#f59e0b;
  }
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.4;}
  body{margin:0 auto;background:var(--bg);color:var(--text);padding:18px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex:none;height:32px;}
  h1{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;}
  .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .row{display:flex;gap:14px;flex:1;overflow:hidden;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:0;display:flex;flex-direction:column;}
  .card-left{flex:0 0 365px !important;width:365px !important;min-width:365px !important;max-width:365px !important;scrollbar-gutter:stable;gap:12px;overflow-y:auto;overflow-x:hidden;}
  .card-left > *{flex-shrink:0;}
  .card-right{flex:1 1 0 !important;min-width:0 !important;overflow:hidden;}
  .label{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.02em}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  button{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;transition:all 0.15s ease;white-space:nowrap;box-sizing:border-box;font-size:13px;display:inline-flex;align-items:center;justify-content:center;}
  .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;box-shadow:0 2px 10px rgba(79,70,229,0.3)}
  .primary:hover{opacity:.95;transform:translateY(-1px);box-shadow:0 4px 14px rgba(6,182,212,0.35)}
  .primary:active{transform:translateY(0)}
  .ghost{background:#171926;color:var(--text);border:1px solid var(--border)}
  .ghost:hover{background:#1f2233;border-color:var(--border-focus)}
  button.ok{background:var(--ok);color:#062419}
  .small{padding:4px 10px;font-size:12px;height:28px;border-radius:6px;}
  .export-issues{--issue-color:var(--warn);margin-top:6px;padding:8px 10px;background:color-mix(in srgb,var(--issue-color) 8%,var(--card));border:1px solid color-mix(in srgb,var(--issue-color) 30%,var(--border));border-radius:8px;font-size:12px;}
  .export-issues[data-severity="error"]{--issue-color:var(--danger,#f87171);}
  .export-issues-header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px;}
  #exportFailureTitle{flex:1 1 160px;min-width:0;color:var(--issue-color);font-weight:600;}
  #exportFailureList details[data-severity="warning"] > summary{color:var(--warn);}
  #exportFailureList details[data-severity="error"] > summary{color:var(--danger,#f87171);}
  button:disabled{opacity:.45;pointer-events:none}
  .support-links{margin-top:auto;padding-top:6px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px;flex:none;}
  .support-link{display:flex;align-items:center;gap:10px;min-height:38px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;transition:background .15s ease,color .15s ease;}
  .support-link:hover{background:var(--card-inner);color:var(--text);}
  .support-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .support-link-icon{width:16px;height:16px;flex:none;}
  .support-link-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500;}
  .support-link-arrow{font-size:12px;opacity:.6;flex:none;transition:opacity .15s ease,transform .15s ease;}
  .support-link:hover .support-link-arrow{opacity:1;transform:translate(1px,-1px);}
  .direct-write-modal{width:min(440px,92vw);max-height:90vh;overflow-y:auto;padding:20px;border:1px solid var(--border-focus);border-radius:14px;background:var(--card);color:var(--text);box-shadow:0 18px 50px rgba(0,0,0,.38)}
  .direct-write-modal::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
  .direct-write-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .direct-write-header h2{font-size:16px;line-height:1.4;margin:0}
  .direct-write-header button{height:28px;width:28px;flex:none;padding:0;border:1px solid var(--border);background:var(--card-inner);color:var(--muted)}
  .direct-write-description{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 16px}
  .direct-write-actions{display:flex;flex-direction:column;gap:8px}
  .direct-write-actions button{min-height:36px;white-space:normal}
  .cleanup-account{font-size:12px;font-weight:600;overflow-wrap:anywhere;margin:0 0 10px}
  .cleanup-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .cleanup-actions .destructive{background:var(--card-inner);color:var(--destructive-text,#ff8a8a);border:1px solid currentColor}
  .cleanup-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .export-preferences{display:flex;flex-direction:column;gap:10px;background:var(--card-inner);padding:12px;border-radius:10px;border:1px solid var(--border)}
  .export-format-row{display:flex;align-items:center;gap:12px;font-size:13px;min-height:32px}
  .export-format-row select{flex:1;min-width:0;height:32px;padding:4px 8px}
  /* Keep select semantics, but paint the picker in the page's top layer so it
     shares our theme and is visible to viewport screenshots and pointer input. */
  @supports (appearance:base-select){
    .page-select,.page-select::picker(select){appearance:base-select}
    .page-select{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer}
    .page-select:hover:not(:disabled){border-color:var(--border-focus)}
    .page-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .page-select:disabled{opacity:.45;cursor:default}
    .page-select::picker-icon{color:var(--muted)}
    .page-select::picker(select){max-width:calc(100vw - 16px);max-height:min(320px,70dvh);overflow-y:auto;margin-top:5px;padding:4px;background:var(--card);color:var(--text);border:1px solid var(--border-focus);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
    .page-select option{overflow-wrap:anywhere;white-space:normal;display:flex;align-items:center;gap:8px;min-height:36px;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer}
    .page-select option:checked{background:color-mix(in srgb,var(--accent) 16%,var(--card))}
    .page-select option:hover,.page-select option:focus{background:color-mix(in srgb,var(--accent) 24%,var(--card));outline:none}
    .page-select option::checkmark{color:var(--accent)}
  }
  .export-skip-row{display:flex;gap:8px;align-items:center;font-size:12px;min-height:24px;cursor:pointer}
  .export-destination{display:flex;flex-direction:column;gap:8px}
  .settings-heading{font-size:12px;font-weight:600;color:var(--text)}
  .delivery-choices{display:flex;flex-direction:column;gap:8px}
  .delivery-card{min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card-inner);transition:border-color .15s ease,background .15s ease}
  .delivery-card:has(.delivery-choice input:checked){border-color:var(--accent);background:var(--card)}
  .delivery-card:has(.delivery-choice input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
  .delivery-choice{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
  .delivery-choice input[type=radio]{width:16px;height:16px;flex:none;margin:0;accent-color:var(--accent);cursor:pointer}
  .delivery-choice input[type=radio]:disabled{cursor:default}
  .delivery-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
  .delivery-title{font-size:13px;font-weight:600}
  .delivery-description{font-size:11px;color:var(--muted)}
  .local-card-details{margin:8px 0 0 26px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;transition:opacity .15s ease}
  .local-card-details.is-disabled{opacity:.45}
  .settings-dir-box{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;min-height:42px;padding:0}
  .dir-meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
  .dir-setting-title{font-size:13px;font-weight:600}
  .dir-meta .stat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dir-meta small{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .settings-divider{height:1px;background:var(--border);flex:none}
  .live-save-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;cursor:pointer}
  .live-save-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
  .live-save-title{font-size:13px;font-weight:600}
  .live-save-hint{font-size:11px;color:var(--muted)}
  #liveSaveStatus{font-size:11px;color:var(--muted);line-height:1.4}
  input[type=checkbox]{accent-color:var(--accent)}
  input[type=checkbox].toggle {
    appearance: none;
    -webkit-appearance: none;
    width: 32px;
    height: 18px;
    background: #1e2030;
    border-radius: 18px;
    position: relative;
    cursor: pointer;
    outline: none;
    margin: 0;
    flex: none;
    transition: background 0.2s;
  }
  input[type=checkbox].toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    background: var(--muted);
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  input[type=checkbox].toggle:checked {
    background: linear-gradient(135deg,var(--accent),var(--accent2));
  }
  input[type=checkbox].toggle:checked::after {
    transform: translateX(14px);
    background: white;
  }
  label:has(input[type=checkbox].toggle) { cursor: pointer; }
  label:has(input[type=checkbox].toggle:disabled) {
    opacity: .45;
    cursor: default;
  }
  input[type=checkbox].toggle:disabled { cursor: default; }
  /* Dev alone uses an inverted direction: ON is left, beside its label. */
  #devToggle::after { transform: translateX(14px); }
  #devToggle:checked::after { transform: translateX(0); }
  /* Modern Sleek WebKit Scrollbars (No standard scrollbar-color/width to avoid Chrome disabling WebKit engine) */
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #333857;
    border-radius: 99px;
    border: 2px solid transparent;
    background-clip: padding-box;
    min-height: 48px;
    transition: background-color 0.2s;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #4f588c;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:active {
    background: #6366f1;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  .list{overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--card-inner)}
  #list::-webkit-scrollbar,
  .list::-webkit-scrollbar {
    width: 10px !important;
  }
  #list::-webkit-scrollbar-track,
  .list::-webkit-scrollbar-track {
    background: rgba(14, 15, 23, 0.8) !important;
    border-radius: 99px !important;
    margin: 4px 0 !important;
  }
  #list::-webkit-scrollbar-thumb,
  .list::-webkit-scrollbar-thumb {
    background: #3b4266 !important;
    border-radius: 99px !important;
    border: 2px solid rgba(14, 15, 23, 0.8) !important;
    background-clip: padding-box !important;
    min-height: 48px !important;
  }
  #list::-webkit-scrollbar-thumb:hover,
  .list::-webkit-scrollbar-thumb:hover {
    background: #596499 !important;
  }
  #list::-webkit-scrollbar-thumb:active,
  .list::-webkit-scrollbar-thumb:active {
    background: #6366f1 !important;
  }
  .item{display:flex;gap:8px;padding:8px;border-radius:8px;align-items:flex-start;transition:background 0.15s;cursor:pointer;user-select:none}
  .item:hover{background:#1a1c2b}
  #list .item[data-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 2px 0 var(--accent)}
  #list .item:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
  @media(prefers-reduced-motion:reduce){#list .item{transition:none}}

  .item input{margin-top:4px}
  .item .title{flex:1;font-size:13px;line-height:1.35}
  .item .meta{font-size:11px;color:var(--muted)}
  .progress{height:8px;flex:none;background:#161824;border-radius:99px;overflow:hidden;margin:10px 0;display:none}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
  .progress.indeterminate .bar{width:30% !important;animation:ui-scan-loading 1.5s linear infinite;transition:none}
  @keyframes ui-scan-loading{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
  .log{font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:160px;overflow:auto;background:var(--card-inner);border:1px solid var(--border);border-radius:8px;padding:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .badge{display:inline-block;background:#171929;border:1px solid var(--border);color:#a5b4fc;padding:2px 8px;border-radius:99px;font-size:11px;margin-left:6px}
  select{background:var(--card-inner);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px}
  select:focus{border-color:var(--border-focus);outline:none}
  .stat{font-size:12px;color:var(--muted)}
  a{color:var(--accent2);text-decoration:none}
  a:hover{text-decoration:underline}
  body:not(.dev-mode) .dev-only { display: none !important; }
  [hidden] { display:none !important; }
  #list .open-link { padding:0 6px;color:var(--muted);flex:none;text-decoration:none; }
  #list .open-link:hover { color:var(--accent2); }
  #list .status-tag {font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--border-focus);margin-left:6px;}
  #list .status-exported {color:#34d399;border-color:#165846;background:#11362f;}
  #list .status-updated {color:#fcd34d;border-color:#80672d;background:#362e19;}
  #list .status-failed {color:#fca5a5;border-color:#713b3b;background:#351b23;}
  #list .status-prepared {color:var(--muted);border-color:var(--border-focus);background:var(--card);}
  #list .status-unavailable {color:#fcd34d;border-color:#80672d;background:#362e19;}
  .attachment-issues {font-size:12px;margin-top:6px;overflow-wrap:anywhere;}
  .attachment-issues summary {cursor:pointer;}
  #list .status-partial {color:#fca5a5;border-color:#713b3b;background:#351b23;}
  #list .meta {font-size:11px;color:var(--muted)}

  .conversation-toolbar{display:flex;align-items:center;gap:8px;flex:none;min-height:34px;}
  .conversation-toolbar #btnSyncAll{height:32px;flex:none;padding:4px 11px;font-size:12px;border-radius:8px;}
  .conversation-source{width:clamp(132px,16vw,188px);min-width:120px;flex:none;}
  .conversation-source #accountIdSelect{width:100%;height:32px;min-width:0;padding:4px 9px;font-size:12px;white-space:nowrap;text-overflow:ellipsis;}
  .conversation-source #accountName{height:32px;align-items:center;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card-inner);border:1px solid var(--border);border-radius:8px;}
  .conversation-search{display:flex;align-items:center;gap:6px;height:32px;min-width:82px;flex:1;padding:0 10px;border:1px solid var(--border);background:var(--card-inner);border-radius:8px;color:var(--muted);}
  .conversation-search:focus-within{border-color:var(--border-focus);outline:2px solid var(--accent);outline-offset:1px;}
  .conversation-search svg{flex:none;}
  .conversation-search #chatSearchInput{width:100%;height:100%;min-width:0;padding:0;background:transparent;border:0;outline:none;color:var(--text);font-size:12px;}
  .conversation-search #chatSearchInput::placeholder{color:var(--muted);opacity:.8;}
  .conversation-toolbar #chatFilterSelect{flex:none;width:126px;min-width:0;height:32px;padding:4px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conversation-more{position:relative;flex:none;}
  #btnMoreActions{width:32px;height:32px;padding:0;border-radius:8px;background:transparent;font-size:19px;letter-spacing:1px;line-height:1;}
  #btnMoreActions:hover,#btnMoreActions[aria-expanded="true"]{background:var(--card-inner);}
  #moreActionsMenu{position:absolute;right:0;top:calc(100% + 7px);z-index:20;width:240px;padding:6px;background:var(--card);border:1px solid var(--border-focus);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.28);}
  #moreActionsMenu button{display:flex;width:100%;height:auto;min-height:34px;justify-content:flex-start;align-items:center;text-align:left;padding:8px 10px;font-size:12px;font-weight:500;border:0;border-radius:6px;background:transparent;box-shadow:none;color:var(--text);}
  #moreActionsMenu button:hover{background:var(--card-inner);transform:none;box-shadow:none;}
  #moreActionsMenu button.menu-danger{color:var(--destructive-text,var(--danger));}
  #moreActionsMenu .menu-account-note{display:block;margin:-2px 10px 6px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  #moreActionsMenu #openaiImportHint{white-space:normal;line-height:1.5;}
  #moreActionsMenu .menu-divider{height:1px;background:var(--border);margin:6px 4px;}
  #localDataControls{display:flex;flex-direction:column;gap:0;}
  .conversation-selection{display:flex;align-items:center;gap:9px;flex:none;min-height:26px;margin:8px 1px 4px;padding:0 9px;color:var(--muted);}
  .conversation-selection .stat{font-size:11px;}
  .conversation-selection #btnSelectAll{width:14px;height:14px;margin:0;flex:none;cursor:pointer;accent-color:var(--accent);}
  .conversation-selection #btnSelectAll:disabled{cursor:default;opacity:.45;}
  #list{border:0;border-radius:0;background:transparent;padding:2px 0;}
  @media(max-width:1100px){
    .conversation-toolbar{gap:5px;}
    .conversation-source{width:132px;min-width:110px;}
    .conversation-toolbar #btnSyncAll{padding-inline:8px;font-size:11px;}
    .conversation-toolbar #chatFilterSelect{width:110px;font-size:11px;}
  }
</style>
<link rel="stylesheet" href="/src/ui/shared/theme.css">
<script src="/src/ui/shared/themeBootstrap.js"></script>
</head>
<body>
<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <h1>Gemini Exporter <span id="ver" class="badge"></span></h1>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <button id="btnThemeToggle" type="button" class="ghost small theme-switch" aria-label="切换到浅色模式" title="切换到浅色模式">☀</button>
    <button id="btnPlatformPermissions" type="button" class="ghost small">网站授权</button>
    <button id="btnTourGuide" class="ghost small" style="padding:2px 10px; font-size:11px; height:26px; border-radius:20px; gap:4px; display:inline-flex; align-items:center; cursor:pointer;" title="新手教程 / Onboarding Tour" data-i18n-title="tourBtnGuideTip">
      <span>💡</span> <span data-i18n="tourBtnGuide">新手引导</span>
    </button>
    <div id="devModeWrapper" style="display:inline-flex; align-items:center; gap:6px; user-select:none; background:var(--card-inner); border:1px solid var(--border); padding:3px 8px; border-radius:20px;" title="开发者模式" data-i18n-title="devModeTip">
      <label for="devToggle" id="labelDevMode" style="font-size:11px; font-weight:600; color:var(--muted); transition:color 0.2s; cursor:pointer;">Dev</label>
      <input type="checkbox" id="devToggle" class="toggle">
    </div>
    <div style="display:inline-flex; align-items:center; gap:6px; user-select:none; background:var(--card-inner); border:1px solid var(--border); padding:3px 8px; border-radius:20px;" title="切换语言" data-i18n-title="langSwitchTip">
      <span id="labelLangZh" style="font-size:11px; font-weight:600; color:var(--text); transition:color 0.2s; cursor:pointer;">中</span>
      <input type="checkbox" id="langToggle" class="toggle">
      <span id="labelLangEn" style="font-size:11px; font-weight:600; color:var(--muted); transition:color 0.2s; cursor:pointer;">EN</span>
    </div>
  </div>
</header>

<div class="row">
  <div class="card card-left">
    <div class="export-preferences">
      <label class="export-format-row">
        <span style="color:var(--muted);white-space:nowrap" data-i18n="format">格式</span>
        <select id="format" class="page-select">
          <option value="markdown" selected data-i18n="fmtMarkdown">Markdown (.md)</option>
          <option value="html" data-i18n="fmtHtml">HTML (.html)</option>
          <option value="pdf" data-i18n="fmtPdf">PDF (.pdf)</option>
          <option value="docx" data-i18n="fmtDocx">Word (.docx)</option>
          <option value="json" data-i18n="fmtJsonStandard">JSON (.json)</option>
        </select>
      </label>
      <label class="export-skip-row" data-i18n-title="skipExportedTip" title="格式相同且来源未更新时，跳过完整导出或仅附件返回 HTTP 404 的对话。">
        <input type="checkbox" id="skipExported" class="toggle" checked>
        <span data-i18n="skipExported">跳过已导出</span>
      </label>
      <label class="export-skip-row" data-i18n-title="includeAssetsTip" title="Download images and file attachments">
        <input type="checkbox" id="includeAssets" class="toggle">
        <span data-i18n="includeAssets">下载附件（可能需要更长时间）</span>
      </label>
    </div>

    <div class="export-destination">
      <div class="settings-heading" data-ui-en="Export to" data-ui-zh="导出到">导出到</div>
      <div id="delivery" class="delivery-choices" role="radiogroup" aria-label="Export destination">
        <div class="delivery-card">
          <label class="delivery-choice">
            <input type="radio" name="delivery" value="browserDownload" checked>
            <span class="delivery-copy">
              <span class="delivery-title" data-ui-en="Browser download" data-ui-zh="浏览器下载">浏览器下载</span>
              <span class="delivery-description" data-ui-en="Save using your browser" data-ui-zh="使用浏览器下载设置">使用浏览器下载设置</span>
            </span>
          </label>
        </div>
        <div class="delivery-card">
          <label class="delivery-choice">
            <input type="radio" name="delivery" value="folderWriter">
            <span class="delivery-copy">
              <span class="delivery-title" data-ui-en="Save to local folder" data-ui-zh="保存到本地文件夹">保存到本地文件夹</span>
              <span class="delivery-description" data-ui-en="Write directly to a chosen folder" data-ui-zh="直接写入指定文件夹">直接写入指定文件夹</span>
            </span>
          </label>
          <div id="localFolderControls" class="local-card-details is-disabled">
            <div id="dirBox" class="settings-dir-box">
              <div class="dir-meta">
                <span class="dir-setting-title" data-ui-en="Folder" data-ui-zh="文件夹">文件夹</span>
                <div id="dirLabel" class="stat" title="当前文件夹">未选择文件夹</div>
                <small id="dirPermissionLabel"></small>
              </div>
              <button id="btnSetDir" type="button" class="ghost small" disabled>选择文件夹</button>
            </div>
            <div class="settings-divider"></div>
            <label id="liveSaveControls" class="live-save-row" data-i18n-title="liveSaveDiskTip" title="仅支持 Markdown；切换其他格式时暂停并保留开启状态">
              <span class="live-save-copy">
                <span class="live-save-title" data-i18n="liveSaveDisk">实时保存</span>
                <span class="live-save-hint" data-ui-en="Automatically save updates to this folder" data-ui-zh="自动保存对话更新到此文件夹">自动保存对话更新到此文件夹</span>
              </span>
              <input type="checkbox" id="liveSaveDiskToggle" class="toggle" disabled>
            </label>
            <small id="liveSaveStatus" role="status" aria-live="polite" hidden></small>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:4px; height:40px;">
      <button id="btnExport" class="primary" style="flex:1; height:40px; padding:0;" data-ui-en="Export selected" data-ui-zh="导出选中">导出选中</button>
    </div>
    
    
    <div id="taskProgressPanel" style="position:sticky;bottom:0;z-index:2;background:var(--card);display:flex;flex-direction:column;gap:6px;flex:none;padding:6px 0;">
    </div>
    <div id="exportFailureHost" style="display:contents;"></div>

    <div id="logSection" class="dev-only" style="display:flex; flex-direction:column; gap:8px; flex:1; min-height:90px; overflow:hidden; margin-top:4px;">
      <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; flex:none;">
        <select id="logLevel" class="page-select" title="级别" data-i18n-title="logLevelTitle" style="font-size:11px; padding:4px 6px; border-radius:6px; background:var(--card-inner);">
          <option value="all" data-i18n="logLevelAll">全部日志</option>
          <option value="info" data-i18n="logLevelInfo">简要日志</option>
          <option value="warn" data-i18n="logLevelWarn">警告及错误</option>
          <option value="error" data-i18n="logLevelError">仅错误</option>
        </select>
        <input id="logFilter" type="text" placeholder="过滤关键字 (-排除)" data-i18n-placeholder="logFilterPlaceholder" style="flex:1; min-width:80px; background:var(--card-inner); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:4px 8px; font-size:11px">
        <button id="btnCopyLog" class="ghost small" style="padding:3px 8px; font-size:11px;" data-i18n="btnCopyLog">复制</button>
        <button id="btnClearLog" class="ghost small" style="padding:3px 8px; font-size:11px;" data-i18n="btnClearLog">清空</button>
        <button id="btnExportDiag" class="ghost small dev-only" data-i18n="btnExportDiag" data-i18n-title="btnExportDiagTip" title="导出本次同步底层的详细诊断报告 (包含翻页游标、请求体与停滞原因)" style="color:var(--diagnostic-text, #78a9ff); padding:3px 8px; font-size:11px;">导出诊断</button>
      </div>
      <div id="log" class="log" style="flex:1; overflow-y:auto;" data-i18n="logReady">就绪</div>
    </div>

    <nav class="support-links" aria-label="Support" data-i18n-aria-label="supportLinksLabel">
      <a href="https://tally.so/r/Y56ZBB?source=extension" target="_blank" rel="noopener noreferrer" id="feedbackBox" class="support-link" data-i18n-title="btnFeedbackTip" title="前往表单提交反馈或新功能建议">
        <svg class="support-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h6"/></svg>
        <span class="support-link-label" data-i18n="feedbackAction">提交反馈</span>
        <span class="support-link-arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://discord.gg/e3FgrXUZ8f" target="_blank" rel="noopener noreferrer" id="discordBox" class="support-link" data-i18n-title="discordTip" title="加入我们的 Discord 社区">
        <svg class="support-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="support-link-label" data-i18n="discordAction">加入 Discord</span>
        <span class="support-link-arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://chromewebstore.google.com/detail/gemini-exporter/ldpbiafkgjlaooeplkiooljccpalpkgf/reviews" target="_blank" rel="noopener noreferrer" id="reviewBox" class="support-link" data-i18n-title="reviewTip" title="前往 Chrome 商店评价 Gemini Exporter">
        <svg class="support-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg>
        <span class="support-link-label" data-i18n="reviewAction">去评价</span>
        <span class="support-link-arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
  </div>

  <div class="card card-right">
    <div class="conversation-toolbar">
      <button id="btnSyncAll" class="primary small" data-i18n="btnSyncAll" data-i18n-title="btnSyncAllTip" title="扫描并同步当前账号的会话">同步会话</button>
      <div class="conversation-source">
        <select id="accountIdSelect" class="page-select" aria-label="账号" title="当前来源"></select>
        <span id="accountName" class="stat" style="display:none;"></span>
      </div>
      <div class="conversation-search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
        <input id="chatSearchInput" type="text" placeholder="搜索标题 / ID..." data-i18n-placeholder="searchPlaceholder">
      </div>
      <select id="chatFilterSelect" class="page-select" data-i18n-title="filterSelectTip" title="按导出状态筛选会话">
        <option value="all" data-i18n="filterAll">全部</option>
        <option value="no_record" data-i18n="filterNoRecord">无导出记录</option>
        <option value="has_record" data-i18n="filterHasRecord">有导出记录</option>
      </select>
      <div class="conversation-more">
        <button id="btnMoreActions" type="button" class="ghost small" aria-label="更多操作" aria-expanded="false" aria-controls="moreActionsMenu" title="更多操作">···</button>
        <div id="moreActionsMenu" class="conversation-more-menu" hidden>
          <button id="btnImportTakeout" class="ghost small" data-ui-en="📥 Import ZIP" data-ui-zh="📥 导入 ZIP" title="导入当前所选平台的 ZIP 压缩包">📥 导入 ZIP</button>
          <span id="takeoutAccountName" class="stat menu-account-note" title="Takeout import target"></span>
          <div class="menu-divider"></div>
          <div id="localDataControls" aria-label="本地记录" data-i18n-aria-label="localRecords">
            <button id="btnClearScan" class="ghost small menu-danger" data-ui-en="Clear scan records" data-ui-zh="清除扫描记录" data-i18n-title="clearScanRecordsTip" title="清除当前账号扫描记录">清除扫描记录</button>
            <button id="btnClearExported" class="ghost small dev-only" data-ui-en="Clear export records" data-ui-zh="清除导出记录" data-i18n-title="clearExportRecordsTip" title="清除导出记录">清除导出记录</button>
          </div>
          <button id="btnForceFullScan" class="ghost small" data-ui-en="Scan full history" data-ui-zh="完整扫描历史">强制完整扫描</button>
        </div>
      </div>
      <input type="file" id="takeoutFileInput" accept=".zip" hidden>
    </div>
    <div class="conversation-selection">
      <input id="btnSelectAll" type="checkbox" aria-label="全选当前可见会话">
      <span id="selectedStat" class="stat"></span>
    </div>
    <div id="list" class="list" style="flex:1; margin:0; overflow-y:auto; padding-right:4px;"></div>
  </div>
</div>
<dialog id="directWriteModal" class="direct-write-modal" aria-labelledby="directWritePromptTitle" aria-describedby="directWritePromptText">
  <div class="direct-write-header">
    <h2 id="directWritePromptTitle">💡 大批量导出建议</h2>
    <button id="btnDirectWriteClose" type="button" aria-label="关闭建议">×</button>
  </div>
  <p id="directWritePromptText" class="direct-write-description"></p>
  <div class="direct-write-actions">
    <button id="btnModalSwitchFolder" type="button" class="primary">保存到本地文件夹</button>
    <button id="btnModalContinueZip" type="button" class="ghost">继续浏览器下载</button>
  </div>
</dialog>
<dialog id="cleanupModal" class="direct-write-modal" role="alertdialog" aria-labelledby="cleanupPromptTitle" aria-describedby="cleanupPromptAccount cleanupPromptText">
  <div class="direct-write-header"><h2 id="cleanupPromptTitle"></h2></div>
  <p id="cleanupPromptAccount" class="cleanup-account"></p>
  <p id="cleanupPromptText" class="direct-write-description"></p>
  <div class="cleanup-actions">
    <button id="btnCleanupCancel" type="button" class="ghost" autofocus>取消</button>
    <button id="btnCleanupConfirm" type="button" class="destructive">清除记录</button>
  </div>
</dialog>
<!-- PR5: JSZip stays external (UMD global), bundled workbench follows -->
<script src="/lib/jszip.min.js"></script>
<script src="/dist/ui/options.js"></script>
</body>
</html>
